[package]
name = "denryu-engine"
version = "1.0.0"
edition = "2021"
description = "Deterministic system-level hydroelectric power generation simulation engine for DENRYU"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
approx = "0.5"
